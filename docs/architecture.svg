<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="EchoCode architecture: VS Code captures editor and project context the moment the hotkey is pressed, streams it with microphone audio to the AssemblyAI Voice Agent API over one WebSocket session, acts on the spoken answer as it plays, and uses a Next.js backend on Vercel that holds the API key, mints single-use session tokens, writes code cards through the LLM Gateway and meters usage." font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>EchoCode architecture</title>
  <desc>A VS Code extension captures the open file, the whole project and the conversation so far the moment the talk hotkey is pressed, then streams them with microphone audio to the AssemblyAI Voice Agent API over a single paced WebSocket session. The spoken answer is played in the panel while the extension highlights the lines being named, opens files that were asked for and offers a code card. A Next.js backend on Vercel holds the AssemblyAI key, mints single-use session tokens, writes code cards through the LLM Gateway and meters monthly usage.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa3bf"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00d8e8"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5fd8"/>
    </marker>
  </defs>

  <rect width="1200" height="900" rx="18" fill="#0b1020"/>

  <!-- ===================== VS Code (your machine) ===================== -->
  <rect x="24" y="24" width="520" height="852" rx="14" fill="#101a2e" stroke="#2a3b57" stroke-width="1.5"/>
  <text x="46" y="58" fill="#e6eefb" font-size="18" font-weight="700">VS Code</text>
  <text x="122" y="58" fill="#8fa3bf" font-size="13.5">(your machine)</text>

  <!-- Extension host -->
  <rect x="40" y="76" width="488" height="540" rx="10" fill="#0e1628" stroke="#24344f"/>
  <text x="58" y="102" fill="#8fa3bf" font-size="11.5" font-weight="700" letter-spacing="1.5">EXTENSION HOST (NODE)</text>

  <rect x="58" y="114" width="452" height="44" rx="8" fill="#12203a" stroke="#00d8e8" stroke-width="1.4"/>
  <text x="76" y="141" fill="#00e5ff" font-size="13.5" font-weight="700">Ctrl+Alt+Space</text>
  <text x="196" y="141" fill="#8fa3bf" font-size="13.5">→</text>
  <text x="214" y="141" fill="#e6eefb" font-size="13.5" font-weight="700">SessionController</text>
  <text x="348" y="141" fill="#8fa3bf" font-size="12.5">(state machine)</text>

  <!-- Section 1: context -->
  <circle cx="66" cy="180" r="8.5" fill="#12203a" stroke="#8fa3bf"/>
  <text x="66" y="184" fill="#e6eefb" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="84" y="184" fill="#8fa3bf" font-size="10.5" font-weight="700" letter-spacing="1.1">CAPTURED WHEN YOU PRESS, BEFORE THE MIC OPENS</text>
  <g font-size="13">
    <rect x="58" y="192" width="452" height="36" rx="7" fill="#131d33"/>
    <text x="76" y="215" fill="#e6eefb" font-size="13.5" font-weight="700">editorContext</text>
    <text x="214" y="215" fill="#a9b8cf">file · cursor · selection · problems</text>

    <rect x="58" y="232" width="452" height="36" rx="7" fill="#131d33"/>
    <text x="76" y="255" fill="#e6eefb" font-size="13.5" font-weight="700">workspaceIndex</text>
    <text x="214" y="255" fill="#a9b8cf">the whole project, to a 64 KB budget</text>

    <rect x="58" y="272" width="452" height="36" rx="7" fill="#131d33"/>
    <text x="76" y="295" fill="#e6eefb" font-size="13.5" font-weight="700">conversation</text>
    <text x="214" y="295" fill="#a9b8cf">earlier turns, carried to a new session</text>
  </g>

  <!-- Section 2: the session -->
  <circle cx="66" cy="328" r="8.5" fill="#12203a" stroke="#8fa3bf"/>
  <text x="66" y="332" fill="#e6eefb" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="84" y="332" fill="#8fa3bf" font-size="10.5" font-weight="700" letter-spacing="1.1">ONE PACED WEBSOCKET SESSION, KEPT WARM</text>
  <g font-size="13">
    <rect x="58" y="340" width="452" height="36" rx="7" fill="#131d33"/>
    <text x="76" y="363" fill="#e6eefb" font-size="13.5" font-weight="700">MicRecorder</text>
    <text x="214" y="363" fill="#a9b8cf">PvRecorder 16 kHz → 24 kHz · silence-gated</text>

    <rect x="58" y="380" width="452" height="36" rx="7" fill="#1e1533" stroke="#ff5fd8" stroke-width="1.2"/>
    <text x="76" y="403" fill="#ffffff" font-size="13.5" font-weight="700">AgentClient</text>
    <text x="214" y="403" fill="#ffc2f1">session.update per turn · resume ≤ 25 s</text>

    <rect x="58" y="420" width="452" height="36" rx="7" fill="#0d2030" stroke="#00d8e8" stroke-width="1.2"/>
    <text x="76" y="443" fill="#ffffff" font-size="13.5" font-weight="700">tokenProvider</text>
    <text x="214" y="443" fill="#9fdcea">suggestionClient · usageClient</text>
  </g>

  <!-- Section 3: acting on the answer -->
  <circle cx="66" cy="476" r="8.5" fill="#12203a" stroke="#8fa3bf"/>
  <text x="66" y="480" fill="#e6eefb" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="84" y="480" fill="#8fa3bf" font-size="10.5" font-weight="700" letter-spacing="1.1">ACTED ON WHILE THE ANSWER IS STILL PLAYING</text>
  <g font-size="13">
    <rect x="58" y="488" width="452" height="36" rx="7" fill="#131d33"/>
    <text x="76" y="511" fill="#e6eefb" font-size="13.5" font-weight="700">lineReferences</text>
    <text x="214" y="511" fill="#a9b8cf">"line 21" → highlight, timed to the voice</text>

    <rect x="58" y="528" width="452" height="36" rx="7" fill="#131d33"/>
    <text x="76" y="551" fill="#e6eefb" font-size="13.5" font-weight="700">fileRequests</text>
    <text x="214" y="551" fill="#a9b8cf">"open style.css" → the file opens</text>

    <rect x="58" y="568" width="452" height="36" rx="7" fill="#131d33"/>
    <text x="76" y="591" fill="#e6eefb" font-size="13.5" font-weight="700">CodeCards</text>
    <text x="214" y="591" fill="#a9b8cf">declarations · insert or replace a method</text>
  </g>

  <!-- postMessage -->
  <line x1="284" y1="620" x2="284" y2="648" stroke="#8fa3bf" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="296" y="639" fill="#8fa3bf" font-size="11.5">postMessage</text>

  <!-- Webview -->
  <rect x="40" y="652" width="488" height="204" rx="10" fill="#0e1628" stroke="#24344f"/>
  <text x="58" y="678" fill="#8fa3bf" font-size="11.5" font-weight="700" letter-spacing="1.5">WEBVIEW (RIGHT PANEL)</text>
  <g font-size="13">
    <rect x="58" y="688" width="452" height="44" rx="7" fill="#131d33"/>
    <text x="76" y="715" fill="#e6eefb" font-size="13.5" font-weight="700">robot · status · subtitles · chat log</text>

    <rect x="58" y="740" width="452" height="44" rx="7" fill="#131d33"/>
    <text x="76" y="767" fill="#e6eefb" font-size="13.5" font-weight="700">code cards</text>
    <text x="214" y="767" fill="#a9b8cf">Insert at Cursor · Replace lines · Copy</text>

    <rect x="58" y="792" width="452" height="44" rx="7" fill="#131d33"/>
    <text x="76" y="819" fill="#e6eefb" font-size="13.5" font-weight="700">AudioPlayer</text>
    <text x="214" y="819" fill="#a9b8cf">24 kHz PCM → Web Audio, gap-free</text>
  </g>

  <!-- ===================== AssemblyAI: Voice Agent ===================== -->
  <rect x="684" y="96" width="492" height="194" rx="14" fill="#1a1631" stroke="#ff5fd8" stroke-width="1.6"/>
  <text x="708" y="128" fill="#ff8fe4" font-size="11.5" font-weight="700" letter-spacing="1.5">ASSEMBLYAI</text>
  <text x="708" y="158" fill="#ffffff" font-size="21" font-weight="700">Voice Agent API</text>
  <text x="708" y="182" fill="#9b86b0" font-size="11.5">wss://agents.assemblyai.com/v1/ws</text>
  <text x="708" y="210" fill="#e8dcf2" font-size="13">hears · reasons · speaks — one session, no tools</text>
  <text x="708" y="236" fill="#c9b8d8" font-size="12.5">min_latency turns · 40 programming keyterms</text>
  <text x="708" y="258" fill="#c9b8d8" font-size="12.5">george voice · 24 kHz PCM in and out</text>

  <!-- ===================== AssemblyAI: LLM Gateway ===================== -->
  <rect x="684" y="322" width="340" height="112" rx="14" fill="#1a1631" stroke="#ff5fd8" stroke-width="1.3" stroke-dasharray="7 4"/>
  <text x="708" y="350" fill="#ff8fe4" font-size="11.5" font-weight="700" letter-spacing="1.5">ASSEMBLYAI</text>
  <text x="708" y="378" fill="#ffffff" font-size="18" font-weight="700">LLM Gateway</text>
  <text x="708" y="402" fill="#e8dcf2" font-size="12.5">qwen3.5-4b-32k-fast</text>
  <text x="708" y="422" fill="#c9b8d8" font-size="12">writes the code card</text>

  <!-- WebSocket: extension to agent -->
  <path d="M532,390 C620,390 640,240 680,240" fill="none" stroke="#ff5fd8" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <!-- WebSocket: agent to extension -->
  <path d="M680,268 C620,268 620,410 534,410" fill="none" stroke="#ff5fd8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-pink)"/>

  <!-- What travels over the socket -->
  <text x="550" y="106" fill="#ff8fe4" font-size="12.5" font-weight="700">wss</text>
  <line x1="550" y1="120" x2="566" y2="120" stroke="#ff5fd8" stroke-width="2"/>
  <text x="572" y="124" fill="#c9b8d8" font-size="12">mic audio +</text>
  <text x="572" y="140" fill="#c9b8d8" font-size="12">editor context +</text>
  <text x="572" y="156" fill="#c9b8d8" font-size="12">project files</text>
  <line x1="550" y1="172" x2="566" y2="172" stroke="#ff5fd8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="572" y="176" fill="#c9b8d8" font-size="12">spoken answer +</text>
  <text x="572" y="192" fill="#c9b8d8" font-size="12">word-timed words</text>

  <!-- ===================== Vercel backend ===================== -->
  <rect x="684" y="498" width="492" height="378" rx="14" fill="#101a2e" stroke="#00d8e8" stroke-width="1.6"/>
  <text x="708" y="530" fill="#00e5ff" font-size="11.5" font-weight="700" letter-spacing="1.5">VERCEL · NEXT.JS</text>
  <text x="708" y="560" fill="#ffffff" font-size="21" font-weight="700">EchoCode backend</text>

  <rect x="708" y="576" width="444" height="34" rx="6" fill="#0b1020" stroke="#2a3b57"/>
  <text x="722" y="598" fill="#ffd27a" font-size="13" font-weight="700">ASSEMBLYAI_API_KEY</text>
  <text x="886" y="598" fill="#8fa3bf" font-size="12">never leaves here</text>

  <g font-size="12" fill="#a9b8cf">
    <text x="708" y="644" fill="#00e5ff" font-size="13" font-weight="700">/api/token</text>
    <text x="816" y="644">single-use · 120 s to redeem · agent config</text>

    <text x="708" y="678" fill="#00e5ff" font-size="13" font-weight="700">/api/suggest</text>
    <text x="816" y="678">code card, after the answer</text>

    <text x="708" y="712" fill="#00e5ff" font-size="13" font-weight="700">/api/usage</text>
    <text x="816" y="712">free 15 min · pro 150 min a month</text>

    <text x="708" y="746" fill="#00e5ff" font-size="13" font-weight="700">/api/health</text>
    <text x="816" y="746">is the key configured</text>
  </g>

  <line x1="708" y1="776" x2="1152" y2="776" stroke="#2a3b57"/>
  <g font-size="12" fill="#a9b8cf">
    <text x="708" y="804" fill="#e6eefb" font-size="13" font-weight="700">agentConfig</text>
    <text x="816" y="804">one prompt + voice for every client</text>

    <text x="708" y="836" fill="#e6eefb" font-size="13" font-weight="700">landing page</text>
    <text x="816" y="836">hero demo · pricing · install</text>
  </g>

  <!-- HTTPS -->
  <path d="M532,438 C620,438 620,560 680,560" fill="none" stroke="#00d8e8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="550" y="600" fill="#00e5ff" font-size="12.5" font-weight="700">HTTPS</text>
  <text x="550" y="620" fill="#9fdcea" font-size="12">/api/token</text>
  <text x="550" y="637" fill="#9fdcea" font-size="12">/api/suggest</text>
  <text x="550" y="654" fill="#9fdcea" font-size="12">/api/usage</text>

  <!-- Backend mints the session token -->
  <line x1="1090" y1="494" x2="1090" y2="296" stroke="#8fa3bf" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1080" y="466" fill="#8fa3bf" font-size="12" text-anchor="end">mints the session token</text>

  <!-- Backend calls the gateway -->
  <line x1="790" y1="494" x2="790" y2="440" stroke="#8fa3bf" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="800" y="470" fill="#8fa3bf" font-size="12">code card call</text>
</svg>
