<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000" role="img" aria-label="EchoCode system architecture: VS Code shows the editor and voice panel, the EchoCode extension captures context and streams microphone audio to the AssemblyAI Voice Agent over one WebSocket session, and a Next.js backend on Vercel holds the API key, mints session tokens, meters usage and builds code cards through the AssemblyAI LLM Gateway." font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>EchoCode system architecture</title>
  <desc>End-to-end architecture for voice-powered pair programming inside VS Code. The VS Code editor and voice panel sit on top of the EchoCode extension, which holds the core logic: it captures editor and project context, streams microphone audio to the AssemblyAI Voice Agent over a single WebSocket session, plays the spoken reply and acts on it by highlighting lines, opening files and offering code cards. The extension calls an EchoCode backend on Vercel over HTTPS for single-use session tokens, agent configuration and usage metering; that backend calls the AssemblyAI LLM Gateway to write each code card.</desc>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5D4F"/>
    </marker>
  </defs>

  <!-- page -->
  <rect width="1440" height="1000" fill="#EADBC4"/>
  <rect x="8" y="8" width="1424" height="984" rx="16" fill="#F3E7D3" stroke="#D4C1A3" stroke-width="1.5"/>

  <!-- heading -->
  <text x="720" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="#2B2118">EchoCode System Architecture</text>
  <text x="720" y="96" text-anchor="middle" font-size="16" fill="#7A6A58">End-to-end architecture for voice-powered pair programming inside VS Code</text>

  <!-- ============ VS Code (blue, top) ============ -->
  <rect x="500" y="130" width="440" height="200" rx="14" fill="#DDE6EA" stroke="#4A90D9" stroke-width="2"/>
  <rect x="518" y="148" width="28" height="28" rx="7" fill="#4A90D9"/>
  <rect x="524.5" y="155" width="15" height="10" rx="1.5" fill="#DDE6EA"/>
  <path d="M522 169 h20 l-2.5 -3 h-15 z" fill="#DDE6EA"/>
  <text x="720" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#1A4E8A">VS Code</text>
  <text x="720" y="187" text-anchor="middle" font-size="13.5" fill="#48698C">Editor and Voice Panel</text>

  <rect x="522" y="200" width="396" height="112" rx="10" fill="#FBF5EA" stroke="#B3C9DA"/>
  <!-- laptop -->
  <rect x="542" y="222" width="64" height="42" rx="5" fill="#DDE6EA" stroke="#4A90D9" stroke-width="2"/>
  <rect x="550" y="230" width="48" height="26" rx="2" fill="#FBF5EA"/>
  <path d="M534 274 h80 l-8 -10 h-64 z" fill="#DDE6EA" stroke="#4A90D9" stroke-width="2" stroke-linejoin="round"/>
  <rect x="570.5" y="234" width="7" height="12" rx="3.5" fill="#4A90D9"/>
  <path d="M566 244 a8 8 0 0 0 16 0" stroke="#4A90D9" stroke-width="1.8" fill="none"/>
  <path d="M574 252 v4" stroke="#4A90D9" stroke-width="1.8"/>

  <g font-size="12.5" fill="#2B2118">
    <circle cx="639" cy="218" r="2.6" fill="#4A90D9"/><text x="652" y="222">Talk hotkey (Ctrl+Alt+Space)</text>
    <circle cx="639" cy="240" r="2.6" fill="#4A90D9"/><text x="652" y="244">Line highlights in the editor</text>
    <circle cx="639" cy="262" r="2.6" fill="#4A90D9"/><text x="652" y="266">Files opened when asked</text>
    <circle cx="639" cy="284" r="2.6" fill="#4A90D9"/><text x="652" y="288">Code cards: insert or replace</text>
    <circle cx="639" cy="306" r="2.6" fill="#4A90D9"/><text x="652" y="310">Voice panel: subtitles and chat</text>
  </g>

  <!-- VS Code <-> Extension -->
  <line x1="690" y1="332" x2="690" y2="426" stroke="#6B5D4F" stroke-width="1.8" marker-end="url(#head)"/>
  <line x1="760" y1="426" x2="760" y2="334" stroke="#6B5D4F" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#head)"/>
  <g font-size="11.5" fill="#5A4A3A">
    <text x="678" y="366" text-anchor="end">hotkey, cursor,</text>
    <text x="678" y="382" text-anchor="end">selection, problems</text>
    <text x="772" y="366">highlights, cards,</text>
    <text x="772" y="382">subtitles</text>
  </g>

  <!-- ============ Extension (green, centre) ============ -->
  <rect x="500" y="430" width="440" height="300" rx="14" fill="#DFEBD9" stroke="#2E9E6B" stroke-width="2"/>
  <rect x="518" y="448" width="28" height="28" rx="7" fill="#2E9E6B"/>
  <path d="M534 453 l-8 12 h6 l-2 10 l8 -12 h-6 z" fill="#DFEBD9"/>
  <text x="720" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#1D6F49">EchoCode Extension</text>
  <text x="720" y="488" text-anchor="middle" font-size="13.5" fill="#3F7259">Core Application Logic</text>

  <rect x="522" y="502" width="396" height="208" rx="10" fill="#FBF5EA" stroke="#B4D3BC"/>
  <g font-size="12.5" fill="#2B2118">
    <circle cx="546" cy="526" r="2.6" fill="#2E9E6B"/><text x="559" y="530">Session control and state machine</text>
    <circle cx="546" cy="552" r="2.6" fill="#2E9E6B"/><text x="559" y="556">Context capture (file, cursor, selection)</text>
    <circle cx="546" cy="578" r="2.6" fill="#2E9E6B"/><text x="559" y="582">Project index (all files, 64 KB budget)</text>
    <circle cx="546" cy="604" r="2.6" fill="#2E9E6B"/><text x="559" y="608">Microphone capture and paced streaming</text>
    <circle cx="546" cy="630" r="2.6" fill="#2E9E6B"/><text x="559" y="634">Acts on the answer (highlight, open file)</text>
    <circle cx="546" cy="656" r="2.6" fill="#2E9E6B"/><text x="559" y="660">Code card insert and replace</text>
    <circle cx="546" cy="682" r="2.6" fill="#2E9E6B"/><text x="559" y="686">Conversation memory across sessions</text>
  </g>

  <!-- ============ Microphone (red, left) ============ -->
  <rect x="40" y="440" width="380" height="220" rx="14" fill="#F6DDD3" stroke="#E05252" stroke-width="2"/>
  <rect x="58" y="458" width="28" height="28" rx="7" fill="#E05252"/>
  <rect x="68" y="463" width="8" height="12" rx="4" fill="#F6DDD3"/>
  <path d="M65 474 a7 7 0 0 0 14 0" stroke="#F6DDD3" stroke-width="1.6" fill="none"/>
  <path d="M72 481 v4" stroke="#F6DDD3" stroke-width="1.6"/>
  <text x="230" y="476" text-anchor="middle" font-size="19" font-weight="700" fill="#A32B2B">Microphone and Speakers</text>
  <text x="230" y="497" text-anchor="middle" font-size="13.5" fill="#8A4F4F">Audio in and out</text>

  <rect x="60" y="511" width="340" height="128" rx="10" fill="#FBF5EA" stroke="#E6BDB0"/>
  <g font-size="12.5" fill="#2B2118">
    <circle cx="84" cy="537" r="2.6" fill="#E05252"/><text x="97" y="541">Capture the mic at 16 kHz PCM</text>
    <circle cx="84" cy="563" r="2.6" fill="#E05252"/><text x="97" y="567">Push to talk, silence-gated</text>
    <circle cx="84" cy="589" r="2.6" fill="#E05252"/><text x="97" y="593">Play the reply at 24 kHz PCM</text>
    <circle cx="84" cy="615" r="2.6" fill="#E05252"/><text x="97" y="619">Gap-free Web Audio playback</text>
  </g>

  <line x1="422" y1="520" x2="496" y2="520" stroke="#6B5D4F" stroke-width="1.8" marker-end="url(#head)"/>
  <line x1="496" y1="578" x2="424" y2="578" stroke="#6B5D4F" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#head)"/>
  <g font-size="11.5" fill="#5A4A3A" text-anchor="middle">
    <text x="459" y="509">your voice</text>
    <text x="459" y="598">spoken reply</text>
  </g>

  <!-- ============ Voice Agent (purple, right) ============ -->
  <rect x="1020" y="420" width="380" height="240" rx="14" fill="#E9DEEA" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="1038" y="438" width="28" height="28" rx="7" fill="#8B5CF6"/>
  <g stroke="#E9DEEA" stroke-width="2" stroke-linecap="round">
    <path d="M1045 449 v6"/><path d="M1050 445 v14"/><path d="M1055 442 v20"/><path d="M1060 447 v10"/>
  </g>
  <text x="1210" y="456" text-anchor="middle" font-size="19" font-weight="700" fill="#5B21B6">AssemblyAI Voice Agent</text>
  <text x="1210" y="477" text-anchor="middle" font-size="13.5" fill="#675292">Realtime speech-to-speech</text>

  <rect x="1040" y="491" width="340" height="150" rx="10" fill="#FBF5EA" stroke="#D2C2E0"/>
  <g font-size="12.5" fill="#2B2118">
    <circle cx="1064" cy="515" r="2.6" fill="#8B5CF6"/><text x="1077" y="519">Speech recognition with keyterms</text>
    <circle cx="1064" cy="539" r="2.6" fill="#8B5CF6"/><text x="1077" y="543">Understands the code question</text>
    <circle cx="1064" cy="563" r="2.6" fill="#8B5CF6"/><text x="1077" y="567">Speaks the answer (george voice)</text>
    <circle cx="1064" cy="587" r="2.6" fill="#8B5CF6"/><text x="1077" y="591">Word timings drive the highlights</text>
    <circle cx="1064" cy="611" r="2.6" fill="#8B5CF6"/><text x="1077" y="615">One session, no tools</text>
  </g>
  <text x="1210" y="634" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#6F6090">wss://agents.assemblyai.com/v1/ws</text>

  <line x1="942" y1="512" x2="1016" y2="512" stroke="#6B5D4F" stroke-width="1.8" marker-end="url(#head)"/>
  <line x1="1016" y1="580" x2="944" y2="580" stroke="#6B5D4F" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#head)"/>
  <g font-size="11" fill="#5A4A3A" text-anchor="middle">
    <text x="977" y="489">mic audio +</text>
    <text x="977" y="502">editor context</text>
    <text x="977" y="601">voice +</text>
    <text x="977" y="614">transcript</text>
  </g>

  <!-- Extension <-> Backend -->
  <line x1="690" y1="732" x2="690" y2="786" stroke="#6B5D4F" stroke-width="1.8" marker-end="url(#head)"/>
  <line x1="760" y1="786" x2="760" y2="734" stroke="#6B5D4F" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#head)"/>
  <g font-size="11.5" fill="#5A4A3A">
    <text x="678" y="752" text-anchor="end">HTTPS: token,</text>
    <text x="678" y="768" text-anchor="end">suggest, usage</text>
    <text x="772" y="752">token + config,</text>
    <text x="772" y="768">code card</text>
  </g>

  <!-- ============ Backend (amber, bottom) ============ -->
  <rect x="490" y="790" width="460" height="175" rx="14" fill="#F8E3BF" stroke="#E9A23B" stroke-width="2"/>
  <rect x="508" y="808" width="28" height="28" rx="7" fill="#E9A23B"/>
  <g fill="#F8E3BF">
    <rect x="514" y="814" width="16" height="5" rx="1.5"/>
    <rect x="514" y="822" width="16" height="5" rx="1.5"/>
    <rect x="514" y="830" width="16" height="5" rx="1.5"/>
  </g>
  <text x="720" y="826" text-anchor="middle" font-size="19" font-weight="700" fill="#8A5A0B">EchoCode Backend</text>
  <text x="720" y="847" text-anchor="middle" font-size="13.5" fill="#80622E">Next.js on Vercel</text>

  <rect x="512" y="861" width="416" height="90" rx="10" fill="#FBF5EA" stroke="#E6CC9C"/>
  <g font-size="12" fill="#2B2118">
    <circle cx="536" cy="884" r="2.6" fill="#E9A23B"/><text x="548" y="888">Holds the ASSEMBLYAI_API_KEY</text>
    <circle cx="536" cy="908" r="2.6" fill="#E9A23B"/><text x="548" y="912">Mints single-use session tokens</text>
    <circle cx="536" cy="932" r="2.6" fill="#E9A23B"/><text x="548" y="936">Serves the agent configuration</text>
    <circle cx="742" cy="884" r="2.6" fill="#E9A23B"/><text x="754" y="888">Builds code cards</text>
    <circle cx="742" cy="908" r="2.6" fill="#E9A23B"/><text x="754" y="912">Meters monthly usage</text>
    <circle cx="742" cy="932" r="2.6" fill="#E9A23B"/><text x="754" y="936">Landing page and health</text>
  </g>

  <line x1="952" y1="848" x2="1006" y2="848" stroke="#6B5D4F" stroke-width="1.8" marker-end="url(#head)"/>
  <line x1="1006" y1="896" x2="954" y2="896" stroke="#6B5D4F" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#head)"/>
  <g font-size="11.5" fill="#5A4A3A" text-anchor="middle">
    <text x="979" y="837">prompt</text>
    <text x="979" y="916">code card</text>
  </g>

  <!-- ============ LLM Gateway (purple, bottom right) ============ -->
  <rect x="1010" y="790" width="390" height="150" rx="14" fill="#E9DEEA" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="1028" y="808" width="28" height="28" rx="7" fill="#8B5CF6"/>
  <text x="1042" y="829" text-anchor="middle" font-size="15" font-weight="700" fill="#E9DEEA" font-family="ui-monospace, Consolas, monospace">{}</text>
  <text x="1205" y="826" text-anchor="middle" font-size="18" font-weight="700" fill="#5B21B6">AssemblyAI LLM Gateway</text>
  <text x="1205" y="847" text-anchor="middle" font-size="13.5" fill="#675292">Writes the code card</text>

  <rect x="1030" y="861" width="350" height="62" rx="10" fill="#FBF5EA" stroke="#D2C2E0"/>
  <g font-size="12.5" fill="#2B2118">
    <circle cx="1054" cy="884" r="2.6" fill="#8B5CF6"/><text x="1067" y="888">Model qwen3.5-4b-32k-fast</text>
    <circle cx="1054" cy="908" r="2.6" fill="#8B5CF6"/><text x="1067" y="912">Returns the snippet as JSON</text>
  </g>

  <!-- ============ Legend ============ -->
  <rect x="40" y="790" width="380" height="150" rx="12" fill="#FBF5EA" stroke="#D4C1A3" stroke-width="1.5"/>
  <text x="66" y="826" font-size="15" font-weight="700" fill="#3D2F22">Legend</text>
  <line x1="66" y1="866" x2="146" y2="866" stroke="#6B5D4F" stroke-width="1.8" marker-end="url(#head)"/>
  <text x="166" y="870" font-size="13" fill="#5A4A3A">Request / sends</text>
  <line x1="66" y1="906" x2="146" y2="906" stroke="#6B5D4F" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#head)"/>
  <text x="166" y="910" font-size="13" fill="#5A4A3A">Data returned</text>
</svg>
